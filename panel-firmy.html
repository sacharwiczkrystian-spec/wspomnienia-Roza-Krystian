<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel firmy — LOVE Story</title><style>
:root{color-scheme:dark;--bg:#100b0d;--panel:#21151a;--ink:#fff4e7;--muted:#d0bdb9;--line:#60404a;--gold:#f0d99c}*{box-sizing:border-box}body{margin:0;padding:18px;background:radial-gradient(ellipse at 10% 0%,#481728 0,transparent 40%),var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}.wrap{max-width:760px;margin:4vh auto}.card{padding:clamp(20px,5vw,36px);background:var(--panel);border:1px solid var(--line);border-radius:20px;margin-bottom:18px}.hidden{display:none!important}h1{font:500 38px Georgia,serif;color:var(--gold)}h2{font:500 25px Georgia,serif;color:var(--gold)}p,.muted{color:var(--muted)}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #77505a;border-radius:10px;background:#100b0d;color:var(--ink);font:inherit}.field textarea{min-height:110px}.btn{padding:11px 15px;border:1px solid #77505a;border-radius:10px;background:#2a1a20;color:var(--ink);font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#f0d99c,#c59a55);color:#1b1114}.status{color:#ffd0d0;min-height:24px}.ad{border-top:1px solid var(--line);padding:14px 0}.ad strong{color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section id="login" class="card"><div><b>LOVE Story</b></div><p>Strefa zatwierdzonych firm współpracujących</p><h1>Logowanie firmy</h1><form id="loginForm"><div class="field"><label for="loginType">Rodzaj konta</label><select id="loginType"><option value="company">Firma — logowanie NIP-em</option><option value="collaborator">Współpracownik — logowanie e-mailem</option></select></div><div class="field"><label id="loginLabel" for="nip">NIP (10 cyfr)</label><input id="nip" inputmode="numeric" maxlength="13" autocomplete="username" required></div><div class="field"><label for="password">Hasło</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginBtn">Zaloguj się</button></form><p class="muted">Dane logowania przekazuje administrator. Nie ma publicznej rejestracji.</p><div id="loginStatus" class="status"></div></section>
<section id="workspace" class="card hidden"><p>Panel firmy</p><h1 id="companyName"></h1><p id="companyNip"></p><div id="forceChange" class="hidden"><h2>Ustaw własne hasło</h2><p>To pierwsze logowanie. Zmień hasło tymczasowe na własne, unikalne hasło.</p><div class="field"><label>Nowe hasło (minimum 12 znaków)</label><input id="newPassword" type="password" minlength="12"></div><div class="field"><label>Powtórz hasło</label><input id="confirmPassword" type="password" minlength="12"></div><button class="btn primary" id="savePassword">Zapisz hasło</button></div>
<div id="adsArea" class="hidden"><h2>Dodaj reklamę</h2><form id="adForm"><div class="field"><label>Tytuł</label><input id="title" maxlength="100" required></div><div class="field"><label>Opis (20–2000 znaków)</label><textarea id="description" minlength="20" maxlength="2000" required></textarea></div><div class="grid"><div class="field"><label>Strona internetowa (https://)</label><input id="website" type="url" placeholder="https://"></div><div class="field"><label>E-mail kontaktowy</label><input id="contact" type="email"></div></div><div class="field"><label>Telefon</label><input id="phone" maxlength="40"></div><button class="btn primary" id="submitAd">Wyślij do zatwierdzenia</button></form><h2>Moje reklamy</h2><div id="myAds"></div></div><div id="workStatus" class="status"></div><button id="logout" class="btn">Wyloguj</button></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script><script>
(()=>{"use strict";const URL="https://khggputlakhupiypybic.supabase.co",KEY="sb_publishable_NKmlxY9hjAVDeSD4FEhZhQ_8_AOunOe",$=id=>document.getElementById(id);const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});let user,company,accountKind="company";
const say=(s,where="loginStatus")=>$(where).textContent=s;
const nipValid=n=>/^\d{10}$/.test(n)&&[6,5,7,2,3,4,5,6,7].reduce((a,w,i)=>a+w*Number(n[i]),0)%11===Number(n[9]);
async function api(action){const {data:{session}}=await sb.auth.getSession();const r=await fetch("/api/company-accounts",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({action})});const d=await r.json();if(!r.ok)throw Error(d.error||"Błąd serwera");return d}
async function loadAds(){const box=$("myAds");box.textContent="Ładowanie…";let query=sb.from("company_ads").select("title,description,status,admin_note,created_at").order("created_at",{ascending:false});query=accountKind==="collaborator"?query.eq("created_by",user.id):query.eq("company_user_id",user.id);const {data,error}=await query;if(error)throw error;box.replaceChildren();if(!data.length){box.textContent="Nie dodano jeszcze żadnych reklam z tego konta.";return}data.forEach(a=>{const d=document.createElement("div");d.className="ad";const h=document.createElement("strong");h.textContent=a.title+" — "+({pending:"Oczekuje",approved:"Opublikowana",rejected:"Odrzucona"}[a.status]||a.status);const p=document.createElement("p");p.textContent=a.description;d.append(h,p);if(a.admin_note){const n=document.createElement("p");n.textContent="Uwagi: "+a.admin_note;d.append(n)}box.append(d)})}
async function verify(u){const role=await sb.from("staff_permissions").select("permission").eq("user_id",u.id).in("permission",["partner_company","partner_collaborator"]).limit(1);if(role.error||!role.data?.length)throw Error("Konto nie ma uprawnień do panelu reklam.");accountKind=role.data.some(x=>x.permission==="partner_collaborator")?"collaborator":"company";if(accountKind==="collaborator"){const q=await sb.from("partner_collaborator_accounts").select("display_name,company_name,company_nip,company_user_id,must_change_password,account_status").eq("user_id",u.id).single();if(q.error)throw q.error;company={company_name:q.data.company_name,nip:q.data.company_nip,company_user_id:q.data.company_user_id,display_name:q.data.display_name,must_change_password:q.data.must_change_password,account_status:q.data.account_status}}else{const q=await sb.from("partner_company_accounts").select("company_name,nip,must_change_password,account_status").eq("user_id",u.id).single();if(q.error)throw q.error;company={...q.data,company_user_id:u.id}}if(company.account_status!=="active")throw Error("Konto jest nieaktywne. Skontaktuj się z administratorem.");user=u;$("login").classList.add("hidden");$("workspace").classList.remove("hidden");$("companyName").textContent=accountKind==="collaborator"?company.display_name:company.company_name;$("companyNip").textContent="Firma: "+company.company_name+" · NIP: "+company.nip;const change=company.must_change_password||u.app_metadata?.must_change_password===true;$("forceChange").classList.toggle("hidden",!change);$("adsArea").classList.toggle("hidden",change);if(!change)await loadAds()}
$("loginType").addEventListener("change",()=>{const collab=$("loginType").value==="collaborator";$("loginLabel").textContent=collab?"Adres e-mail":"NIP (10 cyfr)";$("nip").placeholder=collab?"wspolpracownik@example.com":"10 cyfr";$("nip").inputMode=collab?"email":"numeric";$("nip").maxLength=collab?254:13;});$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const kind=$("loginType").value;let email;if(kind==="company"){const n=$("nip").value.replace(/\D/g,"");if(!nipValid(n))return say("Nieprawidłowy NIP.");email="nip-"+n+"@partners.love-story-nowa.vercel.app"}else{email=$("nip").value.trim().toLowerCase();if(!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))return say("Podaj prawidłowy adres e-mail.")}$("loginBtn").disabled=true;try{const {data,error}=await sb.auth.signInWithPassword({email,password:$("password").value});if(error)throw Error("Nieprawidłowy login lub hasło.");await verify(data.user)}catch(e){say(e.message)}finally{$("loginBtn").disabled=false}});
$("savePassword").onclick=async()=>{const a=$("newPassword").value,b=$("confirmPassword").value;if(a.length<12)return say("Hasło musi mieć co najmniej 12 znaków.","workStatus");if(a!==b)return say("Hasła nie są identyczne.","workStatus");try{const {error}=await sb.auth.updateUser({password:a});if(error)throw error;await api("complete_password_change");await sb.auth.refreshSession();const {data}=await sb.auth.getUser();await verify(data.user);say("Hasło zmieniono.","workStatus")}catch(e){say(e.message,"workStatus")}};
$("adForm").onsubmit=async e=>{e.preventDefault();const b=$("submitAd");b.disabled=true;try{const website=$("website").value.trim();if(website&&!/^https:\/\//i.test(website))throw Error("Adres strony musi zaczynać się od https://");const {error}=await sb.from("company_ads").insert({company_user_id:accountKind==="collaborator"?company.company_user_id:user.id,created_by:accountKind==="collaborator"?user.id:null,company_name:company.company_name,title:$("title").value.trim(),description:$("description").value.trim(),website_url:website||null,contact_email:$("contact").value.trim()||null,phone:$("phone").value.trim()||null,status:"pending"});if(error)throw error;e.target.reset();await loadAds();say("Reklama wysłana do zatwierdzenia.","workStatus")}catch(e){say(e.message,"workStatus")}finally{b.disabled=false}};
$("logout").onclick=async()=>{await sb.auth.signOut({scope:"local"});location.reload()};
(async()=>{const {data}=await sb.auth.getSession();if(data.session)try{await verify(data.session.user)}catch(e){await sb.auth.signOut({scope:"local"});say(e.message)}})();
})();
</script></body></html>
