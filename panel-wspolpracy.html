<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b0d"><title>LOVE Story — panel współpracy</title><style>*{box-sizing:border-box}body{margin:0;background:#100b0d;color:#f8eee2;font:15px/1.55 system-ui,sans-serif;padding:20px}.card{max-width:480px;margin:7vh auto;background:#21151a;border:1px solid #60404a;border-radius:18px;padding:24px}h1{font-family:Georgia,serif;color:#f4d38a}label{display:block;margin:13px 0 6px;font-size:13px}input{width:100%;padding:12px;border:1px solid #77505a;border-radius:9px;background:#100b0d;color:#fff4e7}button{margin-top:14px;padding:11px 15px;border:0;border-radius:9px;background:#dfbd76;color:#21151a;font-weight:800;cursor:pointer}.status{color:#f4d38a;min-height:24px}.muted{color:#d3c0bb;font-size:13px}.hidden{display:none!important}.warning{padding:12px;border:1px solid #8e6c43;border-radius:10px;background:#38291a}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/phone-verification.js"></script></head><body><main class="card"><h1>Panel współpracy LOVE Story</h1><p class="warning">Wewnętrzny panel projektu. Nie jest oficjalnym systemem żadnej służby i nie nadaje uprawnień państwowych.</p><section id="login"><label>Login</label><input id="loginName" autocomplete="username"><label>Pierwsze hasło</label><input id="password1" type="password" autocomplete="current-password"><button id="step1">Dalej</button></section><section id="second" class="hidden"><p class="muted">Pierwszy etap logowania zakończony. Wpisz drugie, niezależne hasło.</p><label>Drugie hasło</label><input id="password2" type="password" autocomplete="current-password"><button id="step2">Potwierdź drugie hasło</button></section><section id="welcome" class="hidden"><h2 id="welcomeName"></h2><p id="welcomeOrg" class="muted"></p><p>Logowanie do wewnętrznego panelu współpracy zostało potwierdzone.</p><button id="logout">Wyloguj</button></section><p id="status" class="status" role="status"></p></main><script>
const URL="https://khggputlakhupiypybic.supabase.co",PUB="sb_publishable_NKmlxY9hjAVDeSD4FEhZhQ_8_AOunOe",sb=window.supabase.createClient(URL,PUB,{auth:{persistSession:false,autoRefreshToken:false}}),$=id=>document.getElementById(id);let session=null;
function show(id){["login","second","welcome"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function say(t){$("status").textContent=t}
$("step1").onclick=async()=>{const login=$("loginName").value.trim().toLowerCase();if(!/^[a-z0-9._-]{3,32}$/.test(login))return say("Wpisz prawidłowy login.");$("step1").disabled=true;try{const r=await sb.auth.signInWithPassword({email:"svc-"+login+"@service-accounts.love-story-nowa.vercel.app",password:$("password1").value});if(r.error)throw r.error;session=r.data.session;show("second");say("Wpisz drugie hasło.")}catch(e){say("Nie udało się zalogować. Sprawdź login i pierwsze hasło.")}finally{$("step1").disabled=false}};
$("step2").onclick=async()=>{$("step2").disabled=true;try{const r=await fetch("/api/service-accounts",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"verify_second",second_password:$("password2").value})}),d=await r.json();if(!r.ok)throw Error(d.error||"Nie udało się potwierdzić drugiego hasła.");if(window.LoveStoryPhoneVerification&&!await window.LoveStoryPhoneVerification.ensurePhoneVerified(session))throw Error("Weryfikacja numeru telefonu jest wymagana.");$("welcomeName").textContent=d.display_name;$("welcomeOrg").textContent=d.institution_label;show("welcome");say("Dostęp potwierdzony.")}catch(e){say(e.message);$("password2").value=""}finally{$("step2").disabled=false}};
$("logout").onclick=async()=>{await sb.auth.signOut();session=null;$("password1").value="";$("password2").value="";show("login");say("Wylogowano.")};
</script></body></html>
