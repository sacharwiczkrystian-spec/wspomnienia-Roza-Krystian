name: SMS phone MFA checks

on:
  pull_request:
    paths:
      - "index.html"
      - "api/supabase-send-sms.js"
      - "api/supabase-send-sms.test.js"
      - "supabase/sql/**"
      - "supabase/tests/**"
      - ".github/workflows/sms-phone-mfa-checks.yml"
  push:
    branches:
      - "feature/sms-phone-mfa"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax and duplicate IDs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((match, index) => {
            const file = '/tmp/love-story-inline-' + index + '.js';
            fs.writeFileSync(file, match[1]);
            require('node:child_process').execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate element IDs: ' + [...new Set(duplicates)].join(', '));
          console.log('Checked ' + scripts.length + ' inline scripts and ' + ids.length + ' element IDs.');
          NODE
      - name: Check SMS hook syntax
        run: node --check api/supabase-send-sms.js
      - name: Test SMS hook signature and payload
        run: node --test api/supabase-send-sms.test.js
      - name: Check AAL2 SQL hardening candidates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const policies = fs.readFileSync('supabase/sql/mfa-aal2-opt-in-policy-review.sql', 'utf8');
          const rpc = fs.readFileSync('supabase/sql/mfa-aal2-security-definer-hardening-review.sql', 'utf8');
          const test = fs.readFileSync('supabase/tests/mfa-aal2-security-definer-hardening.test.sql', 'utf8');
          const policyCount = [...policies.matchAll(/create policy "mfa_require_aal2_when_factor_enrolled"\s+on public\./gi)].length;
          if (policyCount !== 39) throw new Error('Expected 39 reviewed AAL2 policies, found ' + policyCount);
          const functions = [
            'admin_create_staff_id_card',
            'admin_list_staff_id_cards',
            'admin_list_staff_id_cards_v2',
            'admin_set_staff_id_card_status',
            'admin_list_training_users',
            'admin_set_training_code',
            'get_my_training_materials'
          ];
          for (const name of functions) {
            if (!rpc.includes('function public.' + name + '(')) throw new Error('Missing hardened RPC: ' + name);
          }
          const guardCount = (rpc.match(/perform private\.require_aal2_for_enrolled_mfa\(\);/g) || []).length;
          if (guardCount !== functions.length) throw new Error('Expected ' + functions.length + ' AAL2 RPC guards, found ' + guardCount);
          for (const name of ['admin_list_training_users', 'admin_set_training_code', 'get_my_training_materials']) {
            if (!rpc.includes('revoke all on function public.' + name)) throw new Error('Missing anonymous revoke for ' + name);
          }
          if (!test.includes('has_function_privilege')) throw new Error('Staging privilege assertions missing');
          if (!test.trim().endsWith('$;')) throw new Error('Staging SQL test must end with a complete dollar-quote delimiter');
          if (!/create policy "mfa_require_aal2_when_factor_enrolled"\s+on storage\.objects/i.test(policies)) {
            throw new Error('Missing restrictive AAL2 policy candidate for private Storage objects');
          }
          if (!test.includes("schemaname = 'storage'") || !test.includes("permissive = 'RESTRICTIVE'")) {
            throw new Error('Storage AAL2 policy verification is missing');
          }
          console.log('Checked private Storage AAL2 policy candidate and staging assertion.');
          console.log('Checked ' + policyCount + ' AAL2 policies, ' + guardCount + ' SECURITY DEFINER RPC guards, and anonymous RPC revocations.');
          NODE
