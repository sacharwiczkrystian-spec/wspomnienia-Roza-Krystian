<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b0d"><title>Love Story — Szkolenia</title>
<style>
:root{color-scheme:dark;--bg:#100b0d;--panel:#21151a;--ink:#fff4e7;--muted:#d0bdb9;--line:#60404a;--gold:#f0d99c;--red:#ffd0d0}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 10% 0%,#481728 0,transparent 40%),#100b0d;color:var(--ink);font:15px/1.65 system-ui,sans-serif}.wrap{max-width:900px;margin:5vh auto}.panel{background:linear-gradient(145deg,#21151a,#171014);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,38px);box-shadow:0 18px 50px #0005}.brand{font-weight:900;font-size:21px}.brand span,h1{color:var(--gold)}h1{font:clamp(30px,5vw,42px)/1.2 Georgia,serif;margin:20px 0 10px}h2{font:24px Georgia,serif;color:var(--gold)}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:15px 0}.field input{padding:12px;border:1px solid #77505a;border-radius:10px;background:#100b0d;color:var(--ink);font:inherit}.btn{border:1px solid #77505a;border-radius:10px;padding:11px 15px;background:#2a1a20;color:var(--ink);font:inherit;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#f0d99c,#c59a55);color:#1b1114;border-color:#f0d99c}.status{min-height:24px;color:var(--red);font-size:13px}.hidden{display:none!important}.material{white-space:pre-wrap;overflow-wrap:anywhere;background:#100b0d;border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:var(--gold)}
</style></head><body><main class="wrap"><section class="panel"><div class="top"><div class="brand">Love <span>Story</span></div><a href="/staff.html">← Panel pracownika</a></div><h1>Szkolenia zespołu</h1><p class="muted">Zaloguj się na swoje konto pracownicze i podaj indywidualny kod przydzielony przez administratora.</p>
<form id="loginForm"><div class="field"><label for="email">Adres e-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Hasło konta Love Story</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" id="loginBtn">Zaloguj się</button></form>
<section id="codeSection" class="hidden"><p id="who" class="muted"></p><form id="codeForm"><div class="field"><label for="code">Twój indywidualny kod szkoleniowy</label><input id="code" type="password" minlength="6" maxlength="100" autocomplete="off" required></div><button class="btn primary" id="openBtn">Otwórz materiały</button></form></section>
<p id="status" class="status" role="status" aria-live="polite"></p><section id="materials" class="hidden"><div class="top"><h2 id="materialTitle">Materiały szkoleniowe</h2><button id="download" class="btn" type="button">Pobierz plik .txt</button></div><p class="muted">Treść poniżej została pobrana z chronionej bazy po weryfikacji kodu.</p><article id="materialContent" class="material"></article></section></section></main>
<script>
(()=>{"use strict";const URL="https://khggputlakhupiypybic.supabase.co",KEY="sb_publishable_NKmlxY9hjAVDeSD4FEhZhQ_8_AOunOe", $=id=>document.getElementById(id);let sb=null,materialText="",user=null;
function msg(t){$("status").textContent=t||""}function loadLib(){return new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=ok;s.onerror=()=>no(Error("Nie udało się uruchomić logowania."));document.head.append(s)})}
async function init(){try{if(!window.supabase?.createClient)await loadLib();sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const s=await sb.auth.getSession();if(s.data.session){user=s.data.session.user;showLoggedIn()}}catch(e){msg(e.message||"Błąd uruchamiania strony.")}}
function showLoggedIn(){$("loginForm").classList.add("hidden");$("codeSection").classList.remove("hidden");$("who").textContent="Zalogowano jako "+(user.email||"pracownik")+". Kod jest przypisany do Twojego konta."}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;msg("Logowanie…");try{const r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)throw r.error;user=r.data.user;showLoggedIn();msg("Zalogowano. Wpisz indywidualny kod.");}catch(x){msg(x.message||"Nie udało się zalogować.")}finally{$("loginBtn").disabled=false}});
$("codeForm").addEventListener("submit",async e=>{e.preventDefault();$("openBtn").disabled=true;msg("Weryfikowanie kodu…");$("materials").classList.add("hidden");try{const r=await sb.rpc("get_my_training_materials",{p_code:$("code").value});if(r.error)throw r.error;if(!r.data?.length)throw Error("Brak przypisanych materiałów szkoleniowych.");$("materialTitle").textContent=r.data[0].title;materialText=r.data[0].content;$("materialContent").textContent=materialText;$("materials").classList.remove("hidden");msg("Kod zaakceptowany. Materiały są dostępne.");}catch(x){msg(x.message||"Nie udało się otworzyć materiałów.")}finally{$("openBtn").disabled=false}});
$("download").addEventListener("click",()=>{const blob=new Blob([materialText],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="love-story-materialy-szkoleniowe.txt";a.click();URL.revokeObjectURL(url)});init();
})();
</script></body></html>
